name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela la que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: actions/configure-pages@v6

      # La app va en la raíz del sitio y las lecciones en /lecciones/ (sin archivos de prueba).
      - name: Ensamblar _site
        run: |
          mkdir -p _site/lecciones
          cp -R app/. _site/
          rsync -a --exclude='*.test.js' lecciones/ _site/lecciones/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
